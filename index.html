<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Calculatrice Guinee</title>
<style>
body{font-family:Arial;background:#f5f5f5;display:flex;justify-content:center;padding:20px}
.box{background:white;padding:20px;border-radius:20px;width:100%;max-width:350px;text-align:center}
input{width:90%;padding:12px;margin:10px 0;border:2px solid #0a8a5a;border-radius:10px;font-size:18px}
button{width:45%;padding:12px;margin:5px;background:#0a8a5a;color:white;border:none;border-radius:10px;font-size:18px}
.result{margin-top:20px;font-size:24px;font-weight:bold;color:#0a8a5a}
</style>
</head>
<body>
<div class="box">
<h1>🇬🇳 Calculatrice Guinée</h1>
<p>Par Ibrahimasory - Lambanyi</p>
<input type="number" id="n1" placeholder="Premier nombre">
<input type="number" id="n2" placeholder="Deuxième nombre">
<button onclick="calc('+')">+ Plus</button>
<button onclick="calc('-')">- Moins</button>
<button onclick="calc('*')">x Fois</button>
<button onclick="calc('/')">/ Divisé</button>
<div class="result" id="res">Résultat: 0 GNF</div>
</div>
<script>
function calc(op){
let a=parseFloat(document.getElementById('n1').value);
let b=parseFloat(document.getElementById('n2').value);
if(isNaN(a)||isNaN(b)){document.getElementById('res').innerHTML="Mets les 2 nombres!";return;}
let r=0;
if(op=='+') r=a+b;
if(op=='-') r=a-b;
if(op=='*') r=a*b;
if(op=='/') r=b!=0?a/b:"Impossible";
document.getElementById('res').innerHTML="Résultat: "+r+" GNF";
}
</script>
</body>
</html>
